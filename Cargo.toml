[package]
name = "skiver"
version = "0.2.0"
edition = "2024"

[dependencies]
needletail = "0.5.0"
rust-htslib = "0.44"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }
simple_logger=  { version = "3", features = ["stderr"] }
glob = "0.3.2"
clap = { version = "3", features = ["derive"] }
bincode = "1"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5.15"
rand = "0.9.2"
# Fast, deterministic hasher for the hot u64-keyed maps (count map, neighbours,
# reference consensus). std's SipHash was ~30% of CPU when profiled; FxHash is
# deterministic so byte-identical outputs are preserved.
rustc-hash = "2"
# Heap profiler, only compiled in when the `dhat-heap` feature is enabled.
dhat = { version = "0.3", optional = true }

[features]
# Enable the dhat heap profiler as the global allocator. Build/run with
# `--features dhat-heap`; writes dhat-heap.json on exit. Off by default so
# normal builds keep the system allocator.
dhat-heap = ["dep:dhat"]

# Line numbers in release call stacks for profilers (dhat / Instruments).
[profile.release]
debug = 1
